name: fetch-air-temp
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest reading
        run: |
          mkdir -p data
          curl -sf "https://api-open.data.gov.sg/v2/real-time/api/air-temperature" -o data/latest.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/latest.json
          git diff --cached --quiet || (git commit -m "update" && git push)

name: fetch-air-temp
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-air-temp
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest readings
        run: |
          mkdir -p data
          for pair in "air-temperature:air_temp" "rainfall:rainfall" "pm25:pm25"; do
            api="${pair%%:*}"; name="${pair##*:}"
            curl -sf "https://api-open.data.gov.sg/v2/real-time/api/$api" -o "data/$name.json" \
              || echo "WARN: $api failed"
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "update"
          git pull --rebase origin main
          git push

name: backfill-weather
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
      end:
        description: "End date (YYYY-MM-DD)"
        required: true
      datasets:
        description: "Comma-separated: air_temp,rainfall,pm25"
        required: true
        default: "air_temp,rainfall,pm25"

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - name: Backfill
        timeout-minutes: 330
        env:
          DATAGOV_KEY: ${{ secrets.DATAGOV_KEY }}
        run: python backfill.py "${{ inputs.start }}" "${{ inputs.end }}" "${{ inputs.datasets }}"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/daily
          git diff --cached --quiet && exit 0
          git commit -m "backfill ${{ inputs.start }} to ${{ inputs.end }} (${{ inputs.datasets }})"
          git pull --rebase origin main
          git push
